{% extends "admin/index.html" %}
{% load dashboard_extras %}

{% block content_title %}
{{ block.super }}
<div
    style="margin-bottom: 20px; padding: 20px; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-left: 4px solid #3b82f6; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3); border-radius: 12px;">
    <h4 style="margin: 0; color: #f8fafc; font-size: 1.1rem; font-family: 'Inter', sans-serif; font-weight: 600;">
        <i class="fas fa-database" style="color: #3b82f6; margin-right: 8px;"></i>
        <strong>Tamanho do Banco de Dados:</strong> <span style="color: #60a5fa;">{% get_db_size %}</span>
    </h4>
    <p style="margin: 8px 0 0 28px; font-size: 0.85rem; color: #94a3b8; font-family: 'Inter', sans-serif; line-height: 1.5;">
        Tamanho total dos arquivos no servidor. Limpezas periódicas e o uso de API (ao invés de Syslog) ajudam a manter
        este volume baixo.
    </p>
</div>
{% endblock %}
